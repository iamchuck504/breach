name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Chromium completo (no el headless shell): ver scripts/lib-chrome.mjs
      - run: npx playwright-core install chromium
      # mismas suites que npm test + test:dev, con un reintento por suite
      # (ver scripts/ci-test.mjs)
      - run: node scripts/ci-test.mjs
